[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # Relativo a "base": el directorio real es <repo>/netlify/functions.
  # Se conserva por si en el futuro necesitas lógica server-side con
  # privilegios elevados; el CRUD normal de la app ya no la necesita
  # (habla directo con Supabase, protegido por Row Level Security).
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Netlify Functions (opcional/legacy — ver nota arriba). Debe ir ANTES del
# catch-all SPA.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback: cualquier ruta no encontrada sirve la app de React
# (React Router resuelve la ruta real del lado del cliente).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de seguridad a nivel de servidor (refuerzo del CSP del HTML)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-store"

# Los archivos bajo /assets/ salen de Vite con hash en el nombre
# (ej. index-3Vxboasc.js): son inmutables, se pueden cachear "para siempre".
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
