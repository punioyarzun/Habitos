[build]
  publish = "."

# SPA fallback: any missing route serves la app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de seguridad a nivel de servidor (refuerzo del CSP del HTML)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-store"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
